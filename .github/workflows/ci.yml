name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. Backend Validation (.NET 11)
  # ==========================================
  backend:
    name: Backend Build & Test (.NET 11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7
        ports:
          - 16391:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-password
          MYSQL_DATABASE: redisgui_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pci-password"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Restore dependencies
        run: dotnet restore RedisGUI.slnx

      - name: Build solution
        run: dotnet build RedisGUI.slnx --configuration Release --no-restore

      - name: Run unit & integration tests
        env:
          REDISGUI_TEST_REDIS: 127.0.0.1:16391,allowAdmin=true
          REDISGUI_TEST_MYSQL: Server=127.0.0.1;Port=3306;Database=redisgui_test;User=root;Password=ci-password
        run: dotnet test RedisGUI.slnx --configuration Release --no-build --verbosity normal --logger trx --results-directory TestResults --collect:"XPlat Code Coverage"

      # This test changes Redis server configuration and requires this exact endpoint.
      - name: Run Redis diagnostics integration test
        env:
          REDISGUI_TEST_REDIS: 127.0.0.1:16391
        run: dotnet test test/RedisGUI.Infrastructure.Tests/RedisGUI.Infrastructure.Tests.csproj --configuration Release --no-build --filter FullyQualifiedName~RedisDiagnosticsIntegrationTests --logger "trx;LogFileName=diagnostics.trx" --results-directory TestResults

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults
          if-no-files-found: ignore

  # ==========================================
  # 2. Frontend Validation (Angular 22)
  # ==========================================
  frontend:
    name: Frontend Lint & Build (Node 26 / Angular 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: src/RedisGUI.Client

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: src/RedisGUI.Client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Angular tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build Angular SPA
        run: npm run build -- --configuration production

  # ==========================================
  # 3. Docker Image Verification
  # ==========================================
  docker:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Unified Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: redisgui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
