name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. Backend Validation (.NET 10)
  # ==========================================
  backend:
    name: Backend Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore RedisGUI.slnx

      - name: Build solution
        run: dotnet build RedisGUI.slnx --configuration Release --no-restore

      - name: Run unit & integration tests
        run: dotnet test RedisGUI.slnx --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

  # ==========================================
  # 2. Frontend Validation (Angular 22)
  # ==========================================
  frontend:
    name: Frontend Lint & Build (Node 22 / Angular 22)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/RedisGUI.Client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: src/RedisGUI.Client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Angular SPA
        run: npm run build

  # ==========================================
  # 3. Docker Image Verification
  # ==========================================
  docker:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Unified Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: redisgui:ci
