<div class="stat-summary-card bg-canvas-card rounded-xl p-4 flex items-center gap-4 border border-canvas-border
           transition-transform duration-200 ease-out hover:-translate-y-0.5"
     [class]="'variant-' + variant()">
  <div class="icon-wrapper w-11 h-11 flex items-center justify-center rounded-[10px]">
    <mat-icon class="!text-[22px] !w-[22px] !h-[22px]">{{ icon() }}</mat-icon>
  </div>
  <div class="flex flex-col">
    <div class="text-[22px] font-bold text-canvas-text leading-[1.2]">{{ value() }}</div>
    <div class="text-[12px] text-canvas-muted">{{ label() }}</div>
  </div>
</div>
