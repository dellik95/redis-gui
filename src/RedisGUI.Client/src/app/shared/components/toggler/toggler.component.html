<div class="segmented-control">
  @for (item of config().items; track item.value) {
    <button
      type="button"
      class="segment-btn"
      [class.active]="(value() ?? config().defaultValue) === item.value"
      (click)="selectItem(item.value)">
      @if (item.icon) {
        <mat-icon class="segment-icon">{{ item.icon }}</mat-icon>
      }
      @if (item.label) {
        <span>{{ item.label }}</span>
      }
    </button>
  }
</div>
