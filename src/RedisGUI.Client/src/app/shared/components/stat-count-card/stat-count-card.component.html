<div class="bg-canvas-card rounded-xl py-5 px-4 flex flex-col items-center justify-center
           border border-canvas-border text-center
           transition-transform duration-200 ease-out hover:-translate-y-0.5">
  <mat-icon class="text-canvas-muted">{{ icon() }}</mat-icon>
  <div class="text-[26px] font-bold text-canvas-text mt-1">{{ value() }}</div>
  <div class="text-[11.5px] text-canvas-muted uppercase mt-1">{{ label() }}</div>
</div>
