<div class="flex flex-wrap gap-2" role="radiogroup" [attr.aria-label]="label()">
  @for (option of options(); track option.value) {
    <button
      type="button"
      role="radio"
      [attr.aria-checked]="option.value === value()"
      [class]="option.value === value()
        ? 'rounded-lg border border-brand bg-brand/15 px-3 py-1.5 text-sm font-semibold text-canvas-text shadow-sm transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand'
        : 'rounded-lg border border-canvas-border bg-canvas-card px-3 py-1.5 text-sm font-medium text-canvas-muted transition hover:border-canvas-border-light hover:bg-canvas-hover focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand'"
      (click)="value.set(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>
