<button
  mat-icon-button
  class="docs-theme-picker-trigger"
  [mat-menu-trigger-for]="themeMenu"
  aria-label="Select theme"
  matTooltip="Switch theme"
>
  <mat-icon>palette</mat-icon>
</button>

<mat-menu #themeMenu="matMenu" xPosition="before" class="docs-theme-picker-menu">
  <div
    class="px-4 py-2 text-xs font-semibold text-slate-400 border-b border-slate-700/60 uppercase tracking-wider"
  >
    Theme Palette
  </div>
  @for (theme of themes; track theme.id) {
  <button mat-menu-item (click)="selectTheme(theme.id)" class="theme-menu-item">
    <div class="flex items-center gap-2.5 w-full">
      <span class="theme-color-badge" [style.backgroundColor]="theme.accentColor"></span>
      <span
        class="flex-1 text-sm font-medium"
        [class.theme-active-text]="activeThemeId() === theme.id"
      >
        {{ theme.name }}
      </span>
      @if (activeThemeId() === theme.id) {
      <mat-icon class="theme-check-icon">check</mat-icon>
      }
    </div>
  </button>
  }
</mat-menu>
