<label
  class="ui-toggle"
  [class.ui-toggle--disabled]="disabled()"
  [attr.aria-checked]="checked()"
  role="switch"
>
  <input
    type="checkbox"
    class="ui-toggle__input sr-only"
    [checked]="checked()"
    [disabled]="disabled()"
    (change)="onToggle($event)"
    [attr.aria-label]="label() || null"
  />

  <span class="ui-toggle__track" [class.ui-toggle__track--on]="checked()">
    <span class="ui-toggle__thumb" [class.ui-toggle__thumb--on]="checked()"></span>
  </span>

  @if (label()) {
    <span class="ui-toggle__label" [class.ui-toggle__label--muted]="!checked()">
      {{ label() }}
    </span>
  }
</label>
