<div class="bulk-toolbar" [class.has-selection]="hasSelection()">
  <div class="left-group">
    @if (hasSelection()) {
      <span class="count">{{ selectedCount() }} selected</span>
      <button mat-raised-button color="warn" (click)="deleteSelected.emit()" matTooltip="Delete all selected keys" [disabled]="loading()">
        <mat-icon>delete_sweep</mat-icon>
        Delete Selected
      </button>
      <button mat-button (click)="clearSelection.emit()" matTooltip="Clear selection" [disabled]="loading()">
        <mat-icon>close</mat-icon>
        Clear
      </button>
    } @else {
      <span class="placeholder">No selection</span>
    }
  </div>

  <div class="right-group">
    <button mat-button [matMenuTriggerFor]="exportMenu" matTooltip="Export or Import Redis data" [disabled]="loading()">
      <mat-icon>import_export</mat-icon>
      Export / Import
    </button>
    <mat-menu #exportMenu="matMenu">
      <button mat-menu-item (click)="exportJson.emit()">
        <mat-icon>download</mat-icon>
        Export JSON (pattern {{ pattern() }})
      </button>
      <button mat-menu-item (click)="exportCsv.emit()">
        <mat-icon>download</mat-icon>
        Export CSV (pattern {{ pattern() }})
      </button>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="importData.emit()">
        <mat-icon>upload</mat-icon>
        Import Data
      </button>
    </mat-menu>

    <button mat-button [matMenuTriggerFor]="patternMenu" matTooltip="Bulk delete by pattern" [disabled]="loading()">
      <mat-icon>filter_list</mat-icon>
      Delete by Pattern
    </button>
    <mat-menu #patternMenu="matMenu">
      <button mat-menu-item (click)="deleteByPattern.emit()">
        <mat-icon>delete</mat-icon>
        Delete keys matching '{{ pattern() }}'
      </button>
    </mat-menu>
  </div>
</div>
