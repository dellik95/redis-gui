<div class="flex items-center gap-2">

  @if (hasSelection()) {
    <div class="inline-flex items-center gap-2 py-1 px-2.5 rounded-lg
                bg-red-500/10 border border-red-500/35 animate-[fadeIn_0.15s_ease-in-out]">
      <span class="text-[12px] font-bold text-red-400 pr-1">{{ selectedCount() }} selected</span>

      <button
        type="button"
        class="inline-flex items-center gap-1 h-7 px-2 rounded-md text-[12px] font-semibold
               bg-red-500 text-white border-none cursor-pointer hover:bg-red-600 transition-colors
               disabled:opacity-40 disabled:cursor-not-allowed"
        (click)="deleteSelected.emit()"
        matTooltip="Delete all selected keys"
        [disabled]="loading()"
      >
        <mat-icon class="!text-[16px] !w-4 !h-4">delete_sweep</mat-icon>
        <span>Delete ({{ selectedCount() }})</span>
      </button>

      <button
        type="button"
        class="inline-flex items-center gap-1 h-7 px-2 rounded-md text-[12px] font-medium
               bg-canvas-card text-canvas-text border border-canvas-border cursor-pointer
               hover:bg-canvas-hover transition-colors disabled:opacity-40 disabled:cursor-not-allowed"
        (click)="setBulkTtl.emit()"
        matTooltip="Set TTL on selected keys"
        [disabled]="loading()"
      >
        <mat-icon class="!text-[15px] !w-[15px] !h-[15px]">timer</mat-icon>
        <span>TTL</span>
      </button>

      <button
        type="button"
        class="inline-flex items-center justify-center w-6 h-6 rounded text-canvas-muted
               bg-transparent border-none cursor-pointer hover:text-canvas-text hover:bg-white/10
               transition-colors"
        (click)="clearSelection.emit()"
        matTooltip="Clear selection"
        [disabled]="loading()"
      >
        <mat-icon class="!text-[16px] !w-4 !h-4">close</mat-icon>
      </button>
    </div>
  }

  <div class="flex items-center gap-2">
    <button
      class="btn-secondary"
      [matMenuTriggerFor]="exportMenu"
      matTooltip="Export or Import Redis data"
      [disabled]="loading()"
    >
      <mat-icon>import_export</mat-icon>
      <span>Export / Import</span>
    </button>
    <mat-menu #exportMenu="matMenu">
      <button mat-menu-item (click)="exportJson.emit()">
        <mat-icon>download</mat-icon>
        <span>Export JSON (pattern {{ pattern() }})</span>
      </button>
      <button mat-menu-item (click)="exportCsv.emit()">
        <mat-icon>download</mat-icon>
        <span>Export CSV (pattern {{ pattern() }})</span>
      </button>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="importData.emit()">
        <mat-icon>upload</mat-icon>
        <span>Import Data</span>
      </button>
    </mat-menu>

    <button
      class="btn-secondary"
      [matMenuTriggerFor]="patternMenu"
      matTooltip="Bulk delete by pattern"
      [disabled]="loading()"
    >
      <mat-icon>filter_list</mat-icon>
      <span>Delete by Pattern</span>
    </button>
    <mat-menu #patternMenu="matMenu">
      <button mat-menu-item (click)="deleteByPattern.emit()">
        <mat-icon>delete</mat-icon>
        <span>Delete keys matching '{{ pattern() }}'</span>
      </button>
    </mat-menu>
  </div>
</div>
