<h2 mat-dialog-title>Export Redis Data</h2>
<mat-dialog-content>
  <p class="export-hint">Select the export format for your Redis keys and values:</p>
  
  <ui-radio-group [formField]="exportForm.format" [options]="formatOptions" />

  @if (isLoading()) {
    <div class="loading-container">
      <mat-progress-spinner mode="indeterminate" diameter="24"></mat-progress-spinner>
      <span>Preparing and downloading export...</span>
    </div>
  }
  @if (error()) {
    <div class="error">{{ error() }}</div>
  }
</mat-dialog-content>
<mat-dialog-actions align="end" class="dialog-actions">
  <ui-button variant="ghost" (click)="dialogRef.close()">Cancel</ui-button>
  <ui-button 
    variant="primary" 
    [loading]="isLoading()" 
    (click)="onExport()">
    Export
  </ui-button>
</mat-dialog-actions>
