<div class="storage-container">
  <app-page-header
    icon="storage"
    title="Storage Manager"
    subtitle="Manage Redis database keys, data structures, and memory"
    [badge]="currentConnection()?.name"
    badgeColor="primary"
  >
    <div actions class="flex items-center gap-2.5 flex-wrap">
      @if (isCluster()) {
        <span
          class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold uppercase tracking-[0.4px] bg-brand/15 text-brand border border-brand/30"
          matTooltip="Redis Cluster topology (logical database 0 only)"
        >
          <mat-icon class="!text-[14px] !w-[14px] !h-[14px]">hub</mat-icon>
          <span>Cluster</span>
        </span>
      }
      <app-storage-resources-info
        [connectionId]="id()"
        [activeDatabase]="activeDb()"
      ></app-storage-resources-info>
    </div>
  </app-page-header>

  @if (isReadOnly()) {
    <div class="safe-mode-banner">
      <mat-icon>shield</mat-icon>
      <span
        ><strong>Safe Mode Active:</strong> This Redis connection is in read-only mode to prevent
        accidental data modifications or deletes.</span
      >
    </div>
  }

  <div class="split-view">
    <div class="list-panel" [class.has-editor]="!!selectedKey()">
      <app-storage-values-list
        [connectionId]="id()"
        [activeKey]="selectedKey()?.key ?? null"
        [activeKeyBase64]="selectedKey()?.keyBase64 ?? null"
        (keySelected)="onKeySelected($event)"
      >
      </app-storage-values-list>
    </div>

    @if (selectedKey()) {
      <div class="edit-panel">
        <app-edit-key
          [connectionId]="id()"
          [selectedKey]="selectedKey()!"
          (saved)="onEditSaved()"
          (closed)="onEditClosed()"
        >
        </app-edit-key>
      </div>
    }
  </div>

  <!-- Collapsible Interactive Redis CLI Drawer -->
  <app-redis-cli-drawer [connectionId]="id()" [activeDatabase]="activeDb()"> </app-redis-cli-drawer>
</div>
