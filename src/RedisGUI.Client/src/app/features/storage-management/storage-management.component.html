<div class="storage-container">
    <div class="list-panel">
        <app-storage-values-list 
            [connectionId]="id()"
            (keySelected)="onKeySelected($event)">
        </app-storage-values-list>
    </div>
    
    @if (selectedKey()) {
        <div class="edit-panel">
            <app-edit-key
                [connectionId]="id()"
                [selectedKey]="selectedKey()!"
                (saved)="onEditSaved()"
                (closed)="onEditClosed()">
            </app-edit-key>
        </div>
    }
</div>
