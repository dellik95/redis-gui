<mat-card class="signup-card">
  <mat-card-header>
    <mat-card-title>Create Account</mat-card-title>
    <mat-card-subtitle>Register to start managing your Redis instances</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <div class="demo-banner">
      <div class="demo-info">
        <mat-icon class="demo-icon">verified_user</mat-icon>
        <div class="demo-text">
          <strong>Testing / Demo</strong>
          <span>Click to fill sample registration details</span>
        </div>
      </div>
      <button mat-button type="button" (click)="fillDemoCredentials()" class="demo-fill-btn">
        <mat-icon>auto_fix_high</mat-icon>
        Pre-fill
      </button>
    </div>

    <form (submit)="onSubmit($event)" class="signup-form-fields">
      <div class="name-row">
        <ui-input
          type="text"
          [formField]="registerForm.firstName"
          label="First Name"
          placeholder="John"
          icon="person"
        />

        <ui-input
          type="text"
          [formField]="registerForm.lastName"
          label="Last Name"
          placeholder="Doe"
          icon="person"
        />
      </div>

      <ui-input
        type="email"
        [formField]="registerForm.email"
        label="Email"
        placeholder="your.email@example.com"
        icon="email"
      />

      <ui-input
        [type]="hidePassword() ? 'password' : 'text'"
        [formField]="registerForm.password"
        label="Password"
        placeholder="••••••••"
        icon="lock"
        [suffixIcon]="hidePassword() ? 'visibility' : 'visibility_off'"
        (suffixClicked)="togglePasswordVisibility()"
      />

      <ui-input
        [type]="hideConfirmPassword() ? 'password' : 'text'"
        [formField]="registerForm.confirmPassword"
        label="Confirm Password"
        placeholder="••••••••"
        icon="lock"
        [suffixIcon]="hideConfirmPassword() ? 'visibility' : 'visibility_off'"
        (suffixClicked)="toggleConfirmPasswordVisibility()"
      />

      <ui-button
        type="submit"
        variant="primary"
        size="lg"
        [fullWidth]="true"
        [disabled]="!canSubmit()"
        [loading]="isLoading()"
      >
        Create Account
      </ui-button>

      <div class="login-link">
        <p>Already have an account? <a routerLink="/login">Sign in here</a></p>
      </div>
    </form>
  </mat-card-content>
</mat-card>
