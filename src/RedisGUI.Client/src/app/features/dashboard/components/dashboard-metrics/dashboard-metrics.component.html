@if (connections().length > 0) {
  <div class="metrics-panel">
    <div class="metrics-header">
      <div class="header-left">
        <mat-icon class="dashboard-icon">insights</mat-icon>
        <span class="title">Live Redis Telemetry</span>
        <div class="status-indicator" [class.connected]="isConnected()">
          <span class="pulse-dot"></span>
          <span>{{ isConnected() ? 'Live Stream' : 'Connecting...' }}</span>
        </div>
      </div>

      <div class="header-right">
        <ui-select
          [value]="selectedConnectionId()"
          (valueChange)="switchConnection($event)"
          [options]="connectionOptions()"
          size="sm"
          [fullWidth]="false"
          icon="dns"
        />
      </div>
    </div>

    <div class="metrics-grid">
      <!-- 1. Memory Card -->
      <app-metric-sparkline-card
        label="Memory Usage"
        icon="memory"
        [primaryValue]="memoryMb()"
        unit=" MB"
        [secondaryValue]="'Peak: ' + peakMemoryMb() + ' MB'"
        color="#38bdf8"
        gradientId="memGradient"
        [curve]="memoryCurve()"
      />

      <!-- 2. Operations / sec Card -->
      <app-metric-sparkline-card
        label="Operations / sec"
        icon="speed"
        [primaryValue]="opsPerSec()"
        unit=" ops/s"
        secondaryValue="Realtime"
        color="#10b981"
        gradientId="opsGradient"
        [curve]="opsCurve()"
      />

      <!-- 3. CPU Card -->
      <app-metric-sparkline-card
        label="CPU Usage"
        icon="developer_board"
        [primaryValue]="cpuPercent()"
        unit="%"
        secondaryValue="System &amp; User"
        color="#f59e0b"
        gradientId="cpuGradient"
        [curve]="cpuCurve()"
      />

      <!-- 4. Network & Clients Card — custom secondary content via ng-content -->
      <app-metric-sparkline-card
        label="Clients &amp; Traffic"
        icon="hub"
        [primaryValue]="connectedClients()"
        unit=" clients"
        color="#a855f7"
        gradientId="trafficGradient"
        [curve]="trafficCurve()"
      >
        <div class="net-pills">
          <span class="net-pill in">&darr; {{ networkInKb() }} KB/s</span>
          <span class="net-pill out">&uarr; {{ networkOutKb() }} KB/s</span>
        </div>
      </app-metric-sparkline-card>
    </div>
  </div>
}
